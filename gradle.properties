#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

org.gradle.logging.level=warn
org.gradle.unsafe.configuration-cache.quiet=true
# Fallback-режим для хостов бэкенда/фронтенда (shared/build.gradle.kts -> BuildKonfig -> AppConfig).
# DEBUG   -> tennisscorekeeperbackend.onrender.com / https://tennisscorekeeper.onrender.com
# RELEASE -> api.tennisscorekeeper.tech           / https://tennisscorekeeper.tech
#
# Используется только там, где платформа не задала режим сама:
#   Android — product flavor dev/prod (этот параметр игнорируется);
#   iOS     — конфигурация Xcode через build setting BUILD_MODE -> Info.plist;
#   Desktop — -DBUILD_MODE=RELEASE в рантайме;
#   Web     — ?buildMode=release в адресной строке.
# Переопределяется (по возрастанию приоритета): этот файл < ~/.gradle/gradle.properties
# < -PBUILD_MODE=... < env BUILD_MODE=...
BUILD_MODE=DEBUG
